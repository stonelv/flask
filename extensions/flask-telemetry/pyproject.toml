# flask-telemetry — a reusable OpenTelemetry extension for Flask.
#
# This is a SEPARATE, installable package, intentionally not part of Flask core
# (see ../../docs/adr/0004-observability-as-optional-extension.md). Installing
# Flask never pulls in OpenTelemetry; you opt in by depending on this package.
[project]
name = "flask-telemetry"
version = "0.1.0"
description = "Reusable OpenTelemetry (traces, metrics, logs) extension for Flask."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-flask>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["flit_core>=3.11,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "flask_telemetry"

# Self-contained pytest config so the extension does not inherit the repo-root
# strict filterwarnings (OTel emits provider-override warnings that are expected).
[tool.pytest.ini_options]
testpaths = ["tests"]
