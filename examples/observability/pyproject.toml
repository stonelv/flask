[project]
name = "observability_example"
version = "0.1.0"
description = "OpenTelemetry logs/metrics/traces for a Flask app via existing seams."
readme = "README.rst"
license = {file = "LICENSE.txt"}
maintainers = [{name = "Pallets", email = "contact@palletsprojects.com"}]
classifiers = ["Private :: Do Not Upload"]
dependencies = ["flask"]

[project.urls]
Documentation = "https://flask.palletsprojects.com/patterns/observability/"

[project.optional-dependencies]
observability = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-flask",
    "opentelemetry-instrumentation-logging",
]
test = ["pytest"]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "observability_example"

[tool.pytest.ini_options]
testpaths = ["tests"]
# OTel emits informational warnings (e.g. on provider setup); the example
# tests assert behavior rather than warning-freedom, so do not treat
# warnings as errors here (unlike the main Flask suite).

[tool.coverage.run]
branch = true
source = ["observability_example", "tests"]

[tool.ruff]
src = ["src"]
