# Prometheus scrapes the collector's metrics exporter (port 8889).
scrape_configs:
  - job_name: otel-collector
    scrape_interval: 10s
    static_configs:
      - targets:
          - collector:8889
  - job_name: otel-collector-self
    scrape_interval: 10s
    static_configs:
      - targets:
          - collector:8888
