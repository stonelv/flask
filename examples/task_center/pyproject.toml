[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "task_center"
version = "0.1.0"
description = "A reusable async task center for Flask applications"
authors = [
  { name="Flask Task Center", email="task-center@example.com" }
]
dependencies = [
  "flask>=3.0.0",
  "sqlalchemy>=2.0.0",
  "flask-sqlalchemy>=3.1.0",
  "python-json-logger>=2.0.0",
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["task_center*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
