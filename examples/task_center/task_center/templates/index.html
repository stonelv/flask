<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Task Center</h1>

        <!-- Create Task Form -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Create New Task</h2>
            <form id="taskForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Task Type</label>
                        <select id="taskType" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                            <option value="example_long_task">Example Long Task (10-30s)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Idempotency Key</label>
                        <input type="text" id="idempotencyKey" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Optional">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Payload (JSON)</label>
                    <textarea id="payload" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder='{"key": "value"}'></textarea>
                </div>
                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    Create Task
                </button>
            </form>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Filters</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Status</label>
                    <select id="statusFilter" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                        <option value="">All</option>
                        <option value="PENDING">Pending</option>
                        <option value="RUNNING">Running</option>
                        <option value="SUCCEEDED">Succeeded</option>
                        <option value="FAILED">Failed</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Type</label>
                    <select id="typeFilter" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                        <option value="">All</option>
                        <option value="example_long_task">Example Long Task</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="loadTasks()" class="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500">
                        Refresh
                    </button>
                </div>
            </div>
        </div>

        <!-- Task List -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4">Tasks</h2>
            <div id="taskList" class="space-y-4">
                <!-- Tasks will be loaded here -->
            </div>
            <div id="pagination" class="mt-6 flex justify-between items-center">
                <!-- Pagination will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Task Detail Modal -->
    <div id="taskModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold">Task Details</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">&times;</button>
            </div>
            <div id="taskDetail" class="space-y-2">
                <!-- Task details will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const perPage = 10;

        // Status colors
        const statusColors = {
            'PENDING': 'bg-yellow-100 text-yellow-800',
            'RUNNING': 'bg-blue-100 text-blue-800',
            'SUCCEEDED': 'bg-green-100 text-green-800',
            'FAILED': 'bg-red-100 text-red-800',
            'CANCELLED': 'bg-gray-100 text-gray-800'
        };

        // Load tasks on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadTasks();
            setInterval(loadTasks, 2000); // Auto-refresh every 2 seconds
        });

        // Task form submission
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = document.getElementById('payload').value;
            let parsedPayload = {};

            try {
                if (payload.trim()) {
                    parsedPayload = JSON.parse(payload);
                }
            } catch (err) {
                alert('Invalid JSON payload');
                return;
            }

            const response = await fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: document.getElementById('taskType').value,
                    idempotency_key: document.getElementById('idempotencyKey').value || undefined,
                    payload: parsedPayload
                })
            });

            const data = await response.json();
            if (response.ok) {
                alert(`Task ${response.status === 201 ? 'created' : 'found'}: ${data.id}`);
                document.getElementById('idempotencyKey').value = '';
                document.getElementById('payload').value = '';
                loadTasks();
            } else {
                alert(`Error: ${data.error}`);
            }
        });

        // Filter change
        document.getElementById('statusFilter').addEventListener('change', () => {
            currentPage = 1;
            loadTasks();
        });

        document.getElementById('typeFilter').addEventListener('change', () => {
            currentPage = 1;
            loadTasks();
        });

        async function loadTasks() {
            const status = document.getElementById('statusFilter').value;
            const type = document.getElementById('typeFilter').value;

            let url = `/api/tasks?page=${currentPage}&per_page=${perPage}`;
            if (status) url += `&status=${status}`;
            if (type) url += `&type=${type}`;

            const response = await fetch(url);
            const data = await response.json();

            renderTasks(data.items);
            renderPagination(data);
        }

        function renderTasks(tasks) {
            const taskList = document.getElementById('taskList');

            if (tasks.length === 0) {
                taskList.innerHTML = '<p class="text-gray-500 text-center py-8">No tasks found</p>';
                return;
            }

            taskList.innerHTML = tasks.map(task => `
                <div class="border rounded-lg p-4 hover:shadow-md transition-shadow cursor-pointer" onclick="showTaskDetail('${task.id}')">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="text-sm font-mono text-gray-500">${task.id.slice(0, 8)}...</span>
                            <h3 class="font-medium">${task.type}</h3>
                        </div>
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${statusColors[task.status]}">
                            ${task.status}
                        </span>
                    </div>
                    <div class="mb-2">
                        <div class="flex justify-between text-sm text-gray-600 mb-1">
                            <span>Stage: ${task.stage}</span>
                            <span>${task.progress}%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: ${task.progress}%"></div>
                        </div>
                    </div>
                    <div class="flex justify-between items-center text-sm text-gray-500">
                        <span>Created: ${new Date(task.created_at).toLocaleString()}</span>
                        ${task.status === 'RUNNING' || task.status === 'PENDING' ?
                            `<button onclick="event.stopPropagation(); cancelTask('${task.id}')" class="text-red-600 hover:text-red-800">Cancel</button>` :
                            ''
                        }
                    </div>
                </div>
            `).join('');
        }

        function renderPagination(data) {
            const pagination = document.getElementById('pagination');

            if (data.total_pages <= 1) {
                pagination.innerHTML = `<span class="text-sm text-gray-600">Total: ${data.total} tasks</span>`;
                return;
            }

            pagination.innerHTML = `
                <span class="text-sm text-gray-600">Total: ${data.total} tasks</span>
                <div class="space-x-2">
                    <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}
                        class="px-3 py-1 rounded border ${currentPage === 1 ? 'bg-gray-100 text-gray-400' : 'bg-white hover:bg-gray-50'}">
                        Previous
                    </button>
                    <span class="text-sm text-gray-600">Page ${currentPage} of ${data.total_pages}</span>
                    <button onclick="goToPage(${currentPage + 1})" ${currentPage >= data.total_pages ? 'disabled' : ''}
                        class="px-3 py-1 rounded border ${currentPage >= data.total_pages ? 'bg-gray-100 text-gray-400' : 'bg-white hover:bg-gray-50'}">
                        Next
                    </button>
                </div>
            `;
        }

        function goToPage(page) {
            if (page < 1) return;
            currentPage = page;
            loadTasks();
        }

        async function cancelTask(taskId) {
            if (!confirm('Are you sure you want to cancel this task?')) return;

            const response = await fetch(`/api/tasks/${taskId}/cancel`, { method: 'POST' });
            if (response.ok) {
                loadTasks();
            } else {
                const data = await response.json();
                alert(`Error: ${data.error}`);
            }
        }

        async function showTaskDetail(taskId) {
            const response = await fetch(`/api/tasks/${taskId}`);
            const task = await response.json();

            document.getElementById('taskDetail').innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div><strong>ID:</strong> ${task.id}</div>
                    <div><strong>Type:</strong> ${task.type}</div>
                    <div><strong>Status:</strong> <span class="px-2 py-1 rounded-full text-xs font-medium ${statusColors[task.status]}">${task.status}</span></div>
                    <div><strong>Progress:</strong> ${task.progress}%</div>
                    <div><strong>Stage:</strong> ${task.stage}</div>
                    <div><strong>Idempotency Key:</strong> ${task.idempotency_key || '-'}</div>
                    <div><strong>Created:</strong> ${new Date(task.created_at).toLocaleString()}</div>
                    <div><strong>Started:</strong> ${task.started_at ? new Date(task.started_at).toLocaleString() : '-'}</div>
                    <div><strong>Completed:</strong> ${task.completed_at ? new Date(task.completed_at).toLocaleString() : '-'}</div>
                </div>
                <div class="mt-4">
                    <strong>Payload:</strong>
                    <pre class="bg-gray-100 p-2 rounded mt-1 text-sm overflow-x-auto">${JSON.stringify(task.payload, null, 2)}</pre>
                </div>
                ${task.result ? `
                <div class="mt-4">
                    <strong>Result:</strong>
                    <pre class="bg-green-50 p-2 rounded mt-1 text-sm overflow-x-auto">${JSON.stringify(task.result, null, 2)}</pre>
                </div>
                ` : ''}
                ${task.error ? `
                <div class="mt-4">
                    <strong>Error:</strong>
                    <pre class="bg-red-50 p-2 rounded mt-1 text-sm overflow-x-auto">${task.error}</pre>
                </div>
                ` : ''}
            `;

            document.getElementById('taskModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.add('hidden');
        }

        // Close modal on outside click
        document.getElementById('taskModal').addEventListener('click', (e) => {
            if (e.target.id === 'taskModal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
