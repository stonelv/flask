<!DOCTYPE html>
<html lang="zh-CN" {% if session.theme == 'dark' %}class="dark-theme"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑文章</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>编辑文章</h1>
            <div class="header-actions">
                <a href="{{ url_for('articles.toggle_theme') }}" class="btn btn-secondary">
                    {% if session.theme == 'dark' %}切换到亮色主题{% else %}切换到暗色主题{% endif %}
                </a>
                <a href="{{ url_for('articles.index') }}" class="btn btn-secondary">返回列表</a>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-danger">登出</a>
            </div>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('articles.edit', id=article.id) }}">
            <div class="form-group">
                <label for="title">标题</label>
                <input type="text" id="title" name="title" value="{{ article.title }}" required maxlength="120">
            </div>
            <div class="form-group">
                <label for="content">内容</label>
                <textarea id="content" name="content" rows="10" required>{{ article.content }}</textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">更新文章</button>
                <a href="{{ url_for('articles.index') }}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
</body>
</html>
