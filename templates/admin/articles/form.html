{% extends 'base.html' %}

{% block title %}{{ '编辑文章' if article else '新建文章' }}{% endblock %}

{% block content %}
<div class="form-container">
    <h1>{{ '编辑文章' if article else '新建文章' }}</h1>
    <form method="POST">
        <div class="form-group">
            <label for="title">文章标题</label>
            <input type="text" id="title" name="title" value="{{ article.title if article else '' }}" required maxlength="120">
        </div>
        <div class="form-group">
            <label for="content">文章内容</label>
            <textarea id="content" name="content" rows="15" required>{{ article.content if article else '' }}</textarea>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('articles.list') }}" class="btn btn-secondary">返回</a>
            <button type="submit" class="btn btn-primary">{{ '更新文章' if article else '创建文章' }}</button>
        </div>
    </form>
</div>
{% endblock %}
