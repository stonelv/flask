name: Publish
on:
  push:
    tags: ['*']
permissions: {}
concurrency:
  group: publish-${{ github.event.push.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate version
        id: check
        run: |
          TAG_VERSION="${GITHUB_REF_NAME}"
          PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Error: Tag ($TAG_VERSION) != pyproject.toml ($PYPROJECT_VERSION)"
            exit 1
          fi
          if [[ "$TAG_VERSION" == *".dev"* ]]; then
            echo "Error: Cannot publish dev version ($TAG_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "✓ Validated: $TAG_VERSION"
  build:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: false
          prune-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: pyproject.toml
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV
      - run: uv build
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          echo "Generated checksums:"
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        id: upload-artifact
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  test-pypi:
    needs: [validate, build]
    if: ${{ !contains(github.event.head_commit.message, '[skip testpypi]') }}
    environment:
      name: testpypi
      url: https://test.pypi.org/project/Flask/${{ needs.validate.outputs.version }}/
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: "dist/"
          skip-existing: true
  publish-pypi:
    needs: [validate, build, test-pypi]
    if: ${{ !failure() && !cancelled() }}
    environment:
      name: publish
      url: https://pypi.org/project/Flask/${{ needs.validate.outputs.version }}/
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: "dist/"
  create-release:
    needs: [validate, build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
      - name: Extract release notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if [ -f CHANGES.rst ]; then
            awk "/^Version $VERSION/,/^Version / { if (/^Version / && !/^Version $VERSION/) exit; print }" CHANGES.rst | sed '1,2d' | sed '$d' > release_notes.md
          else
            echo "Release $VERSION" > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since $PREV_TAG" > release_notes.md
              echo "" >> release_notes.md
              git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD >> release_notes.md
            fi
          fi
      - name: Create release
        run: |
          # Verify checksums before release
          cd dist
          if [ -f SHA256SUMS.txt ]; then
            echo "Verifying artifact integrity..."
            sha256sum -c SHA256SUMS.txt || exit 1
            echo "✓ All checksums verified"
          fi
          cd ..
          gh release create --draft --repo ${GITHUB_REPOSITORY} --notes-file release_notes.md ${GITHUB_REF_NAME} dist/*
        env:
          GH_TOKEN: ${{ github.token }}
