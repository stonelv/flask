name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check tag matches version
        id: check
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)

          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)"
            exit 1
          fi

          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "✓ Tag version matches pyproject.toml: $TAG_VERSION"

      - name: Check not a dev version
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          if [[ "$VERSION" == *".dev"* ]] || [[ "$VERSION" == *"-dev"* ]]; then
            echo "Error: Cannot publish dev version ($VERSION) to PyPI"
            exit 1
          fi
          echo "✓ Not a dev version"

  build:
    name: Build distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-pypi:
    name: Publish to TestPyPI
    needs: [validate, build]
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip testpypi]') }}
    environment:
      name: testpypi
      url: https://test.pypi.org/project/flask/${{ needs.validate.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi-publish:
    name: Publish to PyPI
    needs: [validate, build, test-pypi]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/flask/${{ needs.validate.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: [validate, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          # Try to extract from CHANGES.rst
          if [ -f CHANGES.rst ]; then
            awk "/^Version $VERSION/,/^Version / { if (/^Version / && !/^Version $VERSION/) exit; print }" CHANGES.rst | sed '1,2d' | sed '$d' > release_notes.md
          else
            echo "Release $VERSION" > release_notes.md
          fi

          # If empty, generate from git log
          if [ ! -s release_notes.md ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since $PREV_TAG" > release_notes.md
              echo "" >> release_notes.md
              git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD >> release_notes.md
            else
              echo "## Release $VERSION" > release_notes.md
            fi
          fi

          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ steps.notes.outputs.notes_file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
