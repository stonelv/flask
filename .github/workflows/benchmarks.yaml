name: Benchmarks
on:
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  push:
    branches: [main, stable]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
    inputs:
      block_on_regression:
        description: 'Block PR on performance regression'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      regression_threshold:
        description: 'Regression threshold percentage'
        required: false
        default: '10'
        type: string
permissions: {}
concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
          prune-cache: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Run benchmarks
        run: |
          uv run --locked --no-default-groups --group dev --group benchmarks \
            pytest benchmarks/ \
            --benchmark-only \
            --benchmark-json=benchmarks/output.json \
            --benchmark-min-rounds=10 \
            -v

      - name: Upload benchmark results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: benchmark-results
          path: benchmarks/output.json
          retention-days: 30

      - name: Compare with baseline
        if: github.event_name == 'pull_request'
        env:
          BLOCK_ON_REGRESSION: ${{ github.event.inputs.block_on_regression || 'false' }}
          REGRESSION_THRESHOLD: ${{ github.event.inputs.regression_threshold || '10' }}
        run: |
          if [ ! -f benchmarks/baseline.json ]; then
            echo "::warning::No baseline found, skipping comparison"
            exit 0
          fi
          python3 -c "
          import json, sys, os

          block = os.environ.get('BLOCK_ON_REGRESSION', 'false').lower() == 'true'
          threshold = float(os.environ.get('REGRESSION_THRESHOLD', '10'))

          with open('benchmarks/baseline.json') as f:
              baseline = json.load(f)
          with open('benchmarks/output.json') as f:
              current = json.load(f)

          regressions = []
          for bench in current.get('benchmarks', []):
              name = bench['name']
              current_mean = bench['stats']['mean']
              for base_bench in baseline.get('benchmarks', []):
                  if base_bench['name'] == name:
                      base_mean = base_bench['stats']['mean']
                      change_pct = ((current_mean - base_mean) / base_mean) * 100
                      if change_pct > threshold:
                          regressions.append(
                              f'{name}: {current_mean:.6f}s vs baseline '
                              f'{base_mean:.6f}s ({change_pct:+.1f}%)'
                          )
                      break

          if regressions:
              msg = f'Performance regressions detected (>{threshold}%):'
              if block:
                  print(f'::error::{msg}')
                  for r in regressions:
                      print(f'  - {r}')
                  sys.exit(1)
              else:
                  print(f'::warning::{msg}')
                  for r in regressions:
                      print(f'  - {r}')
                  print('Note: Set block_on_regression=true to fail on regressions')
                  sys.exit(0)
          else:
              print(f'✓ No performance regressions detected (threshold: {threshold}%)')
          "

  update-baseline:
    name: Update Baseline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [benchmarks]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Download benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-results
          path: benchmarks/

      - name: Update baseline
        run: |
          cp benchmarks/output.json benchmarks/baseline.json
          if git diff --quiet benchmarks/baseline.json; then
            echo "Baseline unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add benchmarks/baseline.json
            git commit -m "chore: update performance baseline [skip ci]"
            git push
          fi
