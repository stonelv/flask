name: benchmarks
# Performance regression gate. On PRs it benchmarks the hot paths and compares
# against the committed baseline (benchmarks/baseline/baseline.json), posting a
# Markdown report to the run summary. Blocking is configurable: it enforces when
# the repository variable PERF_ENFORCE is 'true', otherwise it is advisory
# (see docs/adr/0003-layered-ci-and-perf-gate.md).
on:
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
    inputs:
      enforce:
        description: "Fail the job on regression"
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      PERF_THRESHOLD: ${{ vars.PERF_THRESHOLD || '0.10' }}
      # enforce when the repo variable is set, or when manually dispatched with enforce=true
      PERF_ENFORCE: ${{ (vars.PERF_ENFORCE == 'true' || inputs.enforce) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
          prune-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: pyproject.toml
      - name: run benchmarks and compare
        run: |
          PERF_REPORT="$GITHUB_STEP_SUMMARY" bash scripts/perf.sh
      - name: upload current run
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: benchmark-${{ github.run_id }}
          path: .perf-current.json
          if-no-files-found: warn
  refresh-baseline:
    # On push to main, regenerate the trimmed baseline and open a PR-less commit
    # artifact so maintainers can update benchmarks/baseline/baseline.json.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
          prune-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: pyproject.toml
      - name: regenerate trimmed baseline
        run: bash scripts/perf.sh --update
      - name: upload refreshed baseline
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: baseline-${{ github.run_id }}
          path: benchmarks/baseline/baseline.json
          if-no-files-found: error
