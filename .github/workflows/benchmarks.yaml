name: benchmarks
# Performance regression gate. Absolute benchmark timings are environment-
# specific, so this never compares against a baseline from a different machine.
# Instead it benchmarks the base commit on the SAME runner and compares it to
# the PR head, then applies a noise-aware threshold. Blocking is configurable
# via the PERF_ENFORCE repository variable (see
# docs/adr/0003-layered-ci-and-perf-gate.md).
on:
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
    inputs:
      enforce:
        description: "Fail the job on regression"
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      PERF_THRESHOLD: ${{ vars.PERF_THRESHOLD || '0.10' }}
      # enforce when the repo variable is set, or when manually dispatched with enforce=true
      PERF_ENFORCE: ${{ (vars.PERF_ENFORCE == 'true' || inputs.enforce) && 'true' || 'false' }}
      BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
      ROUNDS: "10"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
          prune-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: pyproject.toml
      - name: benchmark HEAD
        run: |
          uv run --locked --no-default-groups --group benchmarks pytest benchmarks/ \
            --benchmark-json=head.json --benchmark-min-rounds="$ROUNDS" -q
      - name: benchmark base commit on the same runner
        id: base
        run: |
          base="${BASE_REF:-$(git rev-parse HEAD~1 2>/dev/null || true)}"
          if [ -z "$base" ]; then
            echo "no base commit to compare against"; echo "have=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          git worktree add /tmp/base "$base"
          if [ ! -d /tmp/base/benchmarks ]; then
            echo "base commit has no benchmarks/"; echo "have=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          uv run --directory /tmp/base --no-default-groups --group benchmarks pytest benchmarks/ \
            --benchmark-json=/tmp/base.json --benchmark-min-rounds="$ROUNDS" -q
          echo "have=true" >>"$GITHUB_OUTPUT"
      - name: compare (same-environment, noise-aware)
        run: |
          if [ "${{ steps.base.outputs.have }}" = "true" ]; then
            ref=/tmp/base.json
            echo "comparing against base commit (same runner)"
          else
            ref=benchmarks/baseline/baseline.json
            echo "::warning::no same-runner base; falling back to committed baseline (cross-env, advisory only)"
          fi
          set +e
          uv run --no-default-groups --group benchmarks python benchmarks/compare.py \
            "$ref" head.json --threshold "$PERF_THRESHOLD" --ignore-within-noise \
            --markdown "$GITHUB_STEP_SUMMARY"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if [ "$PERF_ENFORCE" = "true" ] && [ "${{ steps.base.outputs.have }}" = "true" ]; then
              echo "::error::performance regression and PERF_ENFORCE=true"; exit "$status"
            fi
            echo "::warning::performance regression (advisory)"
          fi
      - name: upload runs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: benchmark-${{ github.run_id }}
          path: |
            head.json
          if-no-files-found: warn
