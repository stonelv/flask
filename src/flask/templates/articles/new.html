{% extends 'base.html' %}

{% block title %}新建文章 - 文章管理系统{% endblock %}

{% block content %}
<div class="article-form-container">
    <h1>新建文章</h1>
    <form method="POST" action="{{ url_for('articles.new') }}">
        <div class="form-group">
            <label for="title">标题 <span class="required">*</span></label>
            <input type="text" id="title" name="title" value="{{ title }}" required maxlength="120">
            <small>标题长度不能超过120个字符</small>
        </div>
        <div class="form-group">
            <label for="content">内容 <span class="required">*</span></label>
            <textarea id="content" name="content" rows="15" required>{{ content }}</textarea>
        </div>
        <div class="form-group">
            <label for="is_published">
                <input type="checkbox" id="is_published" name="is_published" {% if is_published %}checked{% endif %}>
                立即发布
            </label>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('articles.index') }}" class="btn btn-secondary">取消</a>
            <button type="submit" class="btn btn-success">创建文章</button>
        </div>
    </form>
</div>
{% endblock %}
